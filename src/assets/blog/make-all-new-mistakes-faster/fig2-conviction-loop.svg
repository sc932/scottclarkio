<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740">
  <defs>
    <marker id="arrowHot" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C2410C"/>
    </marker>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F3A5F"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1240" height="740" fill="#FFFFFF"/>

  <!-- title block -->
  <text x="90" y="52" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#1a1a24">The loop that looks like execution</text>
  <text x="90" y="78" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#8f8f99">a conceptual sketch</text>

  <!-- loop arrows (the trap's engine: the one hot color) -->
  <path d="M 542,166 Q 705,190 707,346" fill="none" stroke="#C2410C" stroke-width="2.5" marker-end="url(#arrowHot)"/>
  <path d="M 707,432 Q 700,570 546,592" fill="none" stroke="#C2410C" stroke-width="2.5" marker-end="url(#arrowHot)"/>
  <path d="M 318,598 Q 175,580 167,440" fill="none" stroke="#C2410C" stroke-width="2.5" marker-end="url(#arrowHot)"/>
  <path d="M 167,342 Q 178,180 314,158" fill="none" stroke="#C2410C" stroke-width="2.5" marker-end="url(#arrowHot)"/>

  <!-- arrow glosses -->
  <text x="750" y="272" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#6b6b75">the new team needs a roadmap</text>
  <text x="645" y="500" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#6b6b75" text-anchor="end">it demands conviction</text>
  <text x="645" y="520" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#6b6b75" text-anchor="end">you don't have yet</text>
  <text x="215" y="545" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#6b6b75">changing it now costs a reorg</text>
  <text x="215" y="248" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-style="italic" fill="#6b6b75">nothing argues against the next hire</text>

  <!-- nodes -->
  <rect x="320" y="130" width="220" height="58" rx="6" fill="#FCFCFD" stroke="#4a4a55" stroke-width="1.5"/>
  <text x="430" y="156" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a1a24" text-anchor="middle">hire ahead of fit</text>
  <text x="430" y="177" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#6b6b75" text-anchor="middle">it worked last time</text>

  <rect x="590" y="352" width="230" height="76" rx="6" fill="#FCFCFD" stroke="#4a4a55" stroke-width="1.5"/>
  <text x="705" y="384" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a1a24" text-anchor="middle">commit to a roadmap</text>
  <text x="705" y="406" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#6b6b75" text-anchor="middle">your best current guess</text>

  <rect x="320" y="560" width="220" height="76" rx="6" fill="#FCFCFD" stroke="#4a4a55" stroke-width="1.5"/>
  <text x="430" y="592" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a1a24" text-anchor="middle">conviction hardens</text>
  <text x="430" y="614" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#6b6b75" text-anchor="middle">the org executes on the guess</text>

  <rect x="30" y="346" width="270" height="88" rx="6" fill="#FCFCFD" stroke="#4a4a55" stroke-width="1.5"/>
  <text x="165" y="378" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a1a24" text-anchor="middle">contrary evidence</text>
  <text x="165" y="399" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a1a24" text-anchor="middle">gets discounted</text>
  <text x="165" y="421" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#6b6b75" text-anchor="middle">a little, each time</text>

  <!-- the trap's face, center -->
  <text x="430" y="368" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-style="italic" fill="#C2410C" text-anchor="middle">from inside,</text>
  <text x="430" y="392" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-style="italic" fill="#C2410C" text-anchor="middle">it looks like execution</text>

  <!-- the exit: deliberate, breaks the loop -->
  <path d="M 100,438 C 85,560 120,672 320,684 C 560,698 720,672 866,624" fill="none" stroke="#1F3A5F" stroke-width="3" marker-end="url(#arrowNavy)"/>
  <text x="300" y="716" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-style="italic" fill="#1F3A5F">named, the pattern becomes checkable: "what moved that we didn't push?"</text>

  <rect x="880" y="550" width="310" height="135" rx="6" fill="#FCFCFD" stroke="#1F3A5F" stroke-width="2"/>
  <text x="900" y="584" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1F3A5F">the honest process</text>
  <text x="896" y="608" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b6b75">test the company against the real market,</text>
  <text x="896" y="627" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b6b75">not against your own hopes;</text>
  <text x="896" y="646" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6b6b75">real alternatives on the table</text>
  <text x="900" y="670" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-style="italic" fill="#1F3A5F">what it buys: a decision instead of a drift</text>
</svg>
