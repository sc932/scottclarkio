title: "Distributional"
description: 'Founded in 2023, Distributional built AI testing and agent behavioral-analytics tools for Fortune 500 enterprises: automated testing and statistical analysis of LLM and agent trace data for continuous AI reliability. In July 2026 it made a <a href="https://distributional.com/blog/distributional-is-now-talaria" target="_blank" rel="noopener">hard pivot</a> to <a href="https://talariasci.com" target="_blank" rel="noopener">Talaria Scientific</a> (same company, same investors), refocusing on a multi-agent harness for computational science. Raised $30M from Andreessen Horowitz, Two Sigma Ventures, and others.'
