description: "Forty-minute seminar plus Q&A at the college where I earned my undergraduate degrees: why the Bitter Lesson and No Free Lunch are both right, why there will always be a frontier between them, the grad-student-descent arc from Bayesian optimization through two failed products, and the research harness that lets a scientist surf the frontier."
