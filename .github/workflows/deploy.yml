name: Build & Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - name: Install dependencies
        # --ignore-scripts: no package lifecycle hook runs in the job that holds the deploy OIDC token.
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: AIO regression gate
        run: node scripts/aio-check.mjs

      - name: Cross-link gate
        run: node scripts/check-crosslinks.mjs

      # Each mutant breaks one code path the gate's self-test claims to pin;
      # the mutated gate must fail its own self-test (a surviving mutant = a
      # vacuous pin — the round-2 finding class, 2026-10-23).
      - name: Cross-link gate mutants
        run: node scripts/check-crosslinks.mutants.mjs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync to S3
        run: |
          # Only content-addressed assets (dist/_astro/*) are immutable.
          # EVERYTHING else lives at a fixed URL (html, feeds, twins, og
          # cards, figure PNGs, favicons, the resume PDF) and rides the
          # short cache class — an unhashed object on the immutable class
          # serves stale for a year (the 2026-07-23 live-metadata lesson).
          # NO --delete here: old hashed assets must survive the HTML
          # cache window (edge/browser HTML up to 1h old still references
          # them) — deleting them at deploy start is an avoidable outage
          # (round-2 S6). Orphan cleanup = phase-4 lifecycle decision.
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET }} \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*" \
            --include "_astro/*"
          # --delete on the mutable pass: a removed post must not stay
          # reachable in S3 while vanishing from the sitemap (sol S2).
          # Hashed-asset deletion is deferred (S6 above), so this pass is
          # the only deletion surface — its filter covers all mutables.
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET }} \
            --delete \
            --cache-control "public, max-age=3600, must-revalidate" \
            --exclude "_astro/*"
          # AIO text surfaces: force correct Content-Type + refresh object
          # metadata even when bytes are unchanged — `sync` skips unchanged
          # files, so a cache-class or content-type fix would otherwise
          # never reach already-live objects (sol S21, 2026-07-23).
          # Repair pass for ALL mutable objects (round-2 S5): unchanged
          # files (figures, favicons, PDFs) migrated from the old immutable
          # class never re-upload via sync, so force their metadata every
          # deploy. Small sites; the re-upload cost is trivial.
          aws s3 cp dist/ s3://${{ secrets.S3_BUCKET }} --recursive \
            --exclude "_astro/*" \
            --cache-control "public, max-age=3600, must-revalidate"
          aws s3 cp dist/ s3://${{ secrets.S3_BUCKET }} --recursive \
            --exclude "*" --include "*.md" \
            --content-type "text/markdown; charset=utf-8" \
            --cache-control "public, max-age=3600, must-revalidate"
          aws s3 cp dist/ s3://${{ secrets.S3_BUCKET }} --recursive \
            --exclude "*" --include "*.txt" \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "public, max-age=3600, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      # Bing-fed surfaces learn about changed URLs immediately; Google
      # ignores IndexNow. Best-effort by design — the script warns and
      # exits 0 on any failure (SPEC-blog-surfaces, AIO layer).
      - name: IndexNow ping
        run: node scripts/indexnow-ping.mjs
